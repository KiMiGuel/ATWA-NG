[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atwa"
version = "2.0.0"
description = "ATWA-NG: v1 scanning engine (vendored aircrack-ng/reaver source) + full native attack/crypto engine, self-contained"
requires-python = ">=3.10"
# Self-contained as of 2026-08-25 — no runtime dependency on n2ng2.
# Just: ~/ATWA-NG/.venv/bin/pip install -e ~/ATWA-NG
dependencies = ["scapy>=2.5", "cryptography>=42"]

[project.scripts]
atwa = "atwa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atwa = ["gui/assets/*.png"]
