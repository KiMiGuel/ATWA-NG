name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use version from pyproject.toml)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Stage binaries
        run: |
          # Binaries are committed under src/atwa/bin/ (built locally with
          # patchelf RUNPATH=$ORIGIN). Verify they are present and executable.
          ls -lh src/atwa/bin/
          test -x src/atwa/bin/aircrack-ng
          test -x src/atwa/bin/aireplay-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scapy cryptography pycryptodome dpkt ttkthemes pyinstaller build pytest

      - name: Create PyInstaller entry point
        run: |
          cat > pyi_entry.py <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from atwa.cli import main
          if __name__ == "__main__":
              main()
          EOF

      - name: Build one-file binary
        run: |
          PYTHONPATH=src pyinstaller --onefile --name atwa --paths src \
            --add-data "src/atwa/gui/assets:atwa/gui/assets" \
            --add-data "src/atwa/bin:atwa/bin" \
            --hidden-import scapy.all --hidden-import scapy.layers.all \
            --hidden-import cryptography --hidden-import dpkt --hidden-import ttkthemes \
            --collect-submodules atwa --collect-submodules scapy \
            pyi_entry.py

      - name: Sync version badges
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import re, subprocess, sys, tomllib
          from pathlib import Path
          REPO = Path(".")
          data = tomllib.loads((REPO / "pyproject.toml").read_text())
          version = str(data["project"]["version"])
          out = subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q"],
                              capture_output=True, text=True, cwd=REPO, check=False).stdout
          m = re.search(r"^(\\d+) tests? collected", out, re.M)
          if not m:
              sys.exit("sync: could not count tests")
          tests = int(m.group(1))
          sys.path.insert(0, str(REPO / "src"))
          from atwa.cli import build_parser
          subs = len(build_parser()._subparsers._group_actions[0].choices)
          print(f"syncing: version={version} subcommands={subs} tests={tests}")
          jobs = [
            (REPO / "README.md", [
              (r"badge/version-[\\d.]+-", f"badge/version-{version}-"),
              (r"badge/subcommands-\\d+-", f"badge/subcommands-{subs}-"),
              (r"badge/tests-\\d+%20passing", f"badge/tests-{tests}%20passing"),
            ]),
            (REPO / "README_ES.md", [
              (r"badge/version-[\\d.]+-", f"badge/version-{version}-"),
              (r"badge/subcomandos-\\d+-", f"badge/subcomandos-{subs}-"),
              (r"badge/tests-\\d+%20passing", f"badge/tests-{tests}%20passing"),
            ]),
            (REPO / "docs" / "index.html", [
              (r"<span class=\\"badge-ver\\">v[\\d.]+</span>", f"<span class=\\"badge-ver\\">v{version}</span>"),
            ]),
          ]
          touched = []
          for path, subs_list in jobs:
              text = path.read_text()
              changed = False
              for pat, repl in subs_list:
                  text, n = re.subn(pat, repl, text)
                  changed = changed or bool(n)
              if changed:
                  path.write_text(text)
                  touched.append(str(path))
          print("updated: " + (", ".join(touched) if touched else "nothing (already in sync)"))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md README_ES.md docs/index.html
            git commit -m "chore: sync version badges [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Resolve release tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/atwa
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

      # PyPI publishing is done manually with twine (see RELEASING notes).