[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atwa"
version = "2.1.0"
description = "ATWA-NG: native WiFi security auditing engine with vendored scanning/cracking binaries, self-contained"
requires-python = ">=3.10"
# Self-contained as of 2026-08-25 — no runtime dependency on n2ng2.
# Just: ~/ATWA-NG/.venv/bin/pip install -e ~/ATWA-NG
dependencies = ["scapy>=2.5", "cryptography>=42", "pycryptodome>=3.20"]

[project.optional-dependencies]
dev = ["ruff>=0.15", "mypy>=1.10", "pyflakes>=3.2"]

[project.scripts]
atwa = "atwa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atwa = ["gui/assets/*.png"]
