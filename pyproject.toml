[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n2ngv2"
version = "0.1.0"
description = "N2-NGv2: v1 scanning engine (vendored aircrack-ng/reaver source) + full native attack/crypto engine, self-contained"
requires-python = ">=3.10"
# Self-contained as of 2026-08-25 — no runtime dependency on n2ng2.
# Just: ~/N2-NG_v2/.venv/bin/pip install -e ~/N2-NG_v2/.simulation/N2-NGv2
dependencies = ["scapy>=2.5", "cryptography>=42"]

[project.scripts]
n2ngv2 = "n2ngv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
